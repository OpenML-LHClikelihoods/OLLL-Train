# GENERAL settings
#
# Targeted sweep for the Sleptons delta=nLL(mu=1)-nLL(mu=0) deficit near
# delta=0, no signal uncertainty (cards/1911.12606-nounc-sleptons.yaml) -
# same idea as parameters_ewkinos_lowdelta.yaml, but Sleptons' own
# no-uncertainty data (results/1911.12606-nounc/Sleptons/training_data/
# cleaned/1911.12606-nounc-sleptons-merged-corr-delta150.csv) is shaped very
# differently from EWKinos': its typical-set mode sits at delta~6-7 (not
# ~22-25), and [2,4) is already reasonably populated (~8.5%) - the genuinely
# thin band is [0,2) ([0,0.25): 0.12%, [0.25,1): 0.86%, [1,2): 2.71% of the
# dataset, 2026-11-20 analysis), so that is the sweep's target here, not
# [0,4).
#
# start_method='fine-tune' (utils.generate_starting_points) draws each
# chain's starting point from a narrow Gaussian centred at zero signal.
# 'scans' is the number of independent such chains sample.py runs per
# invocation (see sample.py's generate_starting_points(n=scans,...) call).
#
# points=40 was picked from a local calibration smoke test (2026-11-20,
# 4 chains, same SR_sigma=CR_sigma=0.01 as below - the value the original
# production Sleptons no-unc run itself used, confirmed from that run's own
# metadata.json): mean delta_exp grows from ~0.05 at step 0 to ~1.3-1.5 by
# step 35-39, landing inside the target [0,2) band without yet drifting into
# the already-denser region beyond it. scans=24 (= cpus-per-task below)
# gives each worker exactly one such chain instead of several run back-to-
# back, same reasoning as the EWKinos sweep (a points=40 chain is not
# "short" - the EWKinos points=50 chain measured ~48 min/chain locally, and
# this one is the same order of magnitude).
---
analyses : ['1911.12606']
input_folder : '../data/'
output_folder : '../tables/'
processes : 24          # match --cpus-per-task in the sbatch script
scans : 24               # one chain per core (see note above)
points : 40              # steps per chain - sweeps delta from ~0 to ~1.5
bkg_unc_samples : 500
low_lim_samples : 30
buffer_size : 20
start_method : 'fine-tune'
scan_criterion : 'mu1'
SR_sigma : 0.05
CR_sigma : 0.02
VR_sigma : 0.02
signal_leakage_CR : True
signal_leakage_CR_spread : 0.10
signal_leakage_CR_sign : 'both'
signal_leakage_VR : False
signal_leakage_VR_spread : 0.10
signal_leakage_VR_sign : 'both'
keep_files : False
fit_bkg : False
spey_verbose_lvl : 0
removeCRsVRs : False
cluster : True
# Edit the settings below to overwrite the general settings above
---
analysis : '1911.12606'
include : cards/1911.12606-nounc-sleptons.yaml
points : 40
scans : 24
buffer_size : 20
signal_leakage_CR_spread : 0.5
signal_leakage_VR_spread : 0.5
remove_channels : []
SR_sigma : 0.01
CR_sigma : 0.01
