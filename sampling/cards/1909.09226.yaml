#
# ATLAS-SUSY-2019-08 / arXiv:1909.09226
# Electroweakinos -> 1 lepton + h(bb) + MET, 139/fb
#
# 14 BINS, not 8: each of the three signal regions is split into three mCT bins
# ([180,230], [230,280], [280,330] GeV, overflow in the last). bkg_yields and
# bkg_unc are indexed per BIN, in the channel order below, so both lists hold
# 14 entries.
#
# Signal regions: published post-fit background from the ATLAS background-only
# fit, HEPData ins1755298 tables t7/t8/t9 ("Expected background", sys (x) stat).
#
# Control regions: not published per bin, so these come from a reproduced
# CR-only fit. They do not affect the scan - a CR bin is centred on its
# OBSERVED yield with range +/- obs * signal_leakage_CR_spread, so bkg_yields
# is never read for a CR. They are kept for the printed table and the metadata.
#
bkgfiles :
    - BkgOnly.json
patchsets :
    - patchset.json
channels :
    -  SRHMEM_mct2 : 'SR'
       SRLMEM_mct2 : 'SR'
       SRMMEM_mct2 : 'SR'
       STCREM_cuts : 'CR'
       TRHMEM_cuts : 'CR'
       TRLMEM_cuts : 'CR'
       TRMMEM_cuts : 'CR'
       WREM_cuts : 'CR'
bkg_yields :
    - 4.059
    - 2.917
    - 1.12
    - 8.833
    - 11.28
    - 7.281
    - 4.588
    - 2.631
    - 1.404
    - 154.27
    - 644.75
    - 665.48
    - 479.98
    - 143.4
bkg_unc :
    - 1.885
    - 1.318
    - 0.4623
