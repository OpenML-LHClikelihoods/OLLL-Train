# GENERAL settings
#
# Targeted sweep for the EWKinos delta=nLL(mu=1)-nLL(mu=0) deficit near
# delta=0: the normal boundary-scan MCMC (parameters.yaml) concentrates its
# samples in the high-dimensional "typical set" of the random walk (delta of
# order tens for the 44-bin EWKinos model), not near S=0 where delta is small
# - yet that's exactly the neighbourhood the expected exclusion threshold
# (delta of order 1-4) sits in. See the chat/notes around 2026-11-19.
#
# start_method='fine-tune' (utils.generate_starting_points) draws each
# chain's starting point from a narrow Gaussian centred at zero signal
# instead of the usual random/default placement. 'scans' is the number of
# independent such chains sample.py runs per invocation (see sample.py's
# generate_starting_points(n=scans,...) call).
#
# points=2 (one MCMC transition per chain) was tried first and was wrong:
# with the default SR_sigma/CR_sigma, a single step already lands the chain
# somewhere in [0, 0.25) and stops there - only the band immediately next to
# delta=0, not the [0.25, 4) band the exclusion threshold actually sits in.
# A local trace of delta vs. step count (points=50, same SR_sigma=CR_sigma=
# 0.01 as below, 2026-11-19) showed delta growing ~linearly with step count
# (it's a quadratic observable of the random-walk displacement, so it grows
# with the walk's variance, i.e. with N, not sqrt(N)) up through the whole
# [0.25, 4) gap by step ~50, without yet drifting into the already-dense
# [4, 20) bulk - so points=50 keeps every one of the walk's own steps as a
# separate, useful training row spread across exactly the depleted band,
# instead of just the last one. scans=8 (= cpus-per-task below) gives each
# worker exactly one such chain instead of several run back-to-back, since
# a points=50 chain is no longer "short" (measured ~48 min/chain locally).
---
analyses : ['1911.12606']
input_folder : '../data/'
output_folder : '../tables/'
processes : 8          # match --cpus-per-task in the sbatch script
scans : 8               # one chain per core (see note above)
points : 50             # steps per chain - sweeps delta from ~0 to ~3
bkg_unc_samples : 500
low_lim_samples : 30
buffer_size : 20
start_method : 'fine-tune'
scan_criterion : 'mu1'
SR_sigma : 0.05
CR_sigma : 0.02
VR_sigma : 0.02
signal_leakage_CR : True
signal_leakage_CR_spread : 0.10
signal_leakage_CR_sign : 'both'
signal_leakage_VR : False
signal_leakage_VR_spread : 0.10
signal_leakage_VR_sign : 'both'
keep_files : False
fit_bkg : False
spey_verbose_lvl : 0
removeCRsVRs : False
cluster : True
# Edit the settings below to overwrite the general settings above
---
analysis : '1911.12606'
include : cards/1911.12606-nounc-EWKinos.yaml
points : 50
scans : 8
buffer_size : 20
signal_leakage_CR_spread : 0.5
signal_leakage_VR_spread : 0.5
remove_channels :
  - SR_eMLLa_Onelep1track_cuts
  - SR_eMLLb_Onelep1track_cuts
  - SR_eMLLc_Onelep1track_cuts
  - SR_eMLLd_Onelep1track_cuts
  - SR_eMLLe_Onelep1track_cuts
  - SR_eMLLf_Onelep1track_cuts
SR_sigma : 0.01
CR_sigma : 0.01
