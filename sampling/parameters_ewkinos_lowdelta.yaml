# GENERAL settings
#
# Targeted sweep for the EWKinos delta=nLL(mu=1)-nLL(mu=0) deficit near
# delta=0: the normal boundary-scan MCMC (parameters.yaml) concentrates its
# samples in the high-dimensional "typical set" of the random walk (delta of
# order tens for the 44-bin EWKinos model), not near S=0 where delta is small
# - yet that's exactly the neighbourhood the expected exclusion threshold
# (delta of order 1-4) sits in. See the chat/notes around 2026-11-19.
#
# start_method='fine-tune' (utils.generate_starting_points) draws each
# chain's starting point from a narrow Gaussian centred at zero signal
# instead of the usual random/default placement, and points=2 keeps each
# chain short so it is flushed before it has time to random-walk away from
# that start. 'scans' is the number of independent such chains sample.py
# runs per invocation (see sample.py's generate_starting_points(n=scans,...)
# call) - a SLURM array task runs 'scans' of these short chains back to
# back/in parallel (processes), not just one, since the fixed per-chain cost
# (the one-off calculate_Lmax maximisation, ~minute) would otherwise be paid
# mostly for SLURM job overhead rather than actual sampling.
---
analyses : ['1911.12606']
input_folder : '../data/'
output_folder : '../tables/'
processes : 8          # match --cpus-per-task in the sbatch script
scans : 40              # short chains per array task (see note above)
points : 2              # steps per chain - short, stays near the S=0 start
bkg_unc_samples : 500
low_lim_samples : 30
buffer_size : 20
start_method : 'fine-tune'
scan_criterion : 'mu1'
SR_sigma : 0.05
CR_sigma : 0.02
VR_sigma : 0.02
signal_leakage_CR : True
signal_leakage_CR_spread : 0.10
signal_leakage_CR_sign : 'both'
signal_leakage_VR : False
signal_leakage_VR_spread : 0.10
signal_leakage_VR_sign : 'both'
keep_files : False
fit_bkg : False
spey_verbose_lvl : 0
removeCRsVRs : False
cluster : True
# Edit the settings below to overwrite the general settings above
---
analysis : '1911.12606'
include : cards/1911.12606-nounc-EWKinos.yaml
points : 2
scans : 40
buffer_size : 20
signal_leakage_CR_spread : 0.5
signal_leakage_VR_spread : 0.5
remove_channels :
  - SR_eMLLa_Onelep1track_cuts
  - SR_eMLLb_Onelep1track_cuts
  - SR_eMLLc_Onelep1track_cuts
  - SR_eMLLd_Onelep1track_cuts
  - SR_eMLLe_Onelep1track_cuts
  - SR_eMLLf_Onelep1track_cuts
SR_sigma : 0.01
CR_sigma : 0.01
